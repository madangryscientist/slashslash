{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "slashslash.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slashslash.labels" . | nindent 4 }}
type: Opaque
stringData:
  GITHUB_CLIENT_ID: {{ required "set github.clientId (or existingSecret)" .Values.github.clientId | quote }}
  GITHUB_CLIENT_SECRET: {{ required "set github.clientSecret (or existingSecret)" .Values.github.clientSecret | quote }}
  {{- with .Values.toggleslash.adminToken }}
  TOGGLESLASH_ADMIN_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
