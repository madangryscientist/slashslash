apiVersion: v1
kind: Service
metadata:
  name: {{ include "slashslash.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slashslash.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "slashslash.selectorLabels" . | nindent 4 }}
  ports:
    - name: pixelslash
      port: 3000
      targetPort: pixelslash
    - name: toggleslash
      port: 8080
      targetPort: toggleslash
