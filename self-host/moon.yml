$schema: "../.moon/cache/schemas/project.json"

# The one self-host image. The smoke test builds the image and runs it under Docker: minutes of
# work, so it is never cached and the gate does not run it (self-host.yml does). The test task is the
# Proxmox install script's dry runs and ShellCheck, which build nothing, so the gate's `:test` runs
# it. The chart task checks the Helm chart in chart/ (lint, renders, kubeconform, the restricted
# pod standard, the committed render): it downloads helm and kubeconform, so the gate does not run it
# either (self-host.yml does). The typecheck and lint tasks cover the scripts here, the Proxmox
# tests and the in-image health check. There is no build task here.
tasks:
  typecheck:
    script: "bun run tsc --noEmit -p self-host/tsconfig.json"
    options:
      runFromWorkspaceRoot: true
  lint:
    script: "bun run oxlint --type-aware --deny-warnings self-host"
    options:
      runFromWorkspaceRoot: true
  smoke:
    command: "bun smoke.ts"
    options:
      cache: false
  test:
    command: "bun test proxmox"
    inputs:
      - "proxmox/**"
  chart:
    command: "bun chart.ts"
    inputs:
      - "chart/**"
      - "chart.ts"
      - "build.ts"
      - "VERSION"
