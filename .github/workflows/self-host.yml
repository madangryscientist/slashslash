name: Self-host image

# Builds the one self-host image and runs its smoke test, on any change to self-host/ or to this
# file. Each product image takes minutes to build, so it is kept in the Actions cache under its pin
# and rebuilt only when that pin moves.
#
# The image the smoke passed is then pushed to ghcr.io/slashsuite/slashslash, from the same
# job, so what is published is exactly what was tested. A pull request pushes nothing. A push to
# main pushes `:edge` and `:<VERSION>-edge.<sha7>`. A tag `self-host-vX.Y.Z` (X.Y.Z must be
# self-host/VERSION, checked before anything is built) pushes `:X.Y.Z` and `:latest`, and then the
# Helm chart in self-host/chart to oci://ghcr.io/slashsuite/charts. Main pushes no chart.
on:
  pull_request:
    paths:
      - "self-host/**"
      - ".github/workflows/self-host.yml"
  push:
    branches: [main]
    # Path filters are not applied to tag pushes, so every release tag runs.
    tags: ["self-host-v*"]
    paths:
      - "self-host/**"
      - ".github/workflows/self-host.yml"

permissions:
  contents: read

# Only a pull request's run is cut off by a newer one; a main or tag run is never stopped between
# two pushes.
concurrency:
  group: self-host-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # See ci.yml: moon diffs against the base branch first, which needs the full history.
      MOON_BASE: origin/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Check a release tag names self-host/VERSION
        if: github.ref_type == 'tag'
        run: bun self-host/release-check.ts
      # The version the image is built with, so the image the smoke tests already says what it is.
      - id: version
        shell: bash
        run: |
          v=$(cat self-host/VERSION)
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "self-host/VERSION is not X.Y.Z: '$v'"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "tags=$v latest" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "version=$v-edge.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "tags=edge $v-edge.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$v-dev" >> "$GITHUB_OUTPUT"
          fi
      - run: bun install --frozen-lockfile
      # Before the image build: helm lint, both renders, kubeconform, the restricted pod standard,
      # the committed render and Chart.yaml's version. No cluster.
      - run: bunx moon run self-host:chart
      # Restored here and saved straight after the build, so a red smoke still keeps a fresh product.
      - id: pixelslash
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/product-images/pixelslash.tar.gz
          key: self-host-pixelslash-${{ hashFiles('self-host/pins/pixelslash.sha') }}
      - id: toggleslash
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/product-images/toggleslash.tar.gz
          key: self-host-toggleslash-${{ hashFiles('self-host/pins/toggleslash.sha') }}
      # bash, so GitHub adds pipefail: a failed load or save turns the run red instead of caching junk.
      - name: Load the cached product images
        shell: bash
        run: for f in "$RUNNER_TEMP/product-images"/*.tar.gz; do if [ -e "$f" ]; then docker load -i "$f"; fi; done
      - name: Build the image (and any product whose pin has no cached image)
        run: bun self-host/build.ts --tag slashslash:smoke --version "${{ steps.version.outputs.version }}"
      - name: Export the product images that were built
        if: steps.pixelslash.outputs.cache-hit != 'true' || steps.toggleslash.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/product-images"
          for p in pixelslash toggleslash; do
            [ -e "$RUNNER_TEMP/product-images/$p.tar.gz" ] || docker save "slashslash-product/$p:$(cat self-host/pins/$p.sha)" | gzip -1 > "$RUNNER_TEMP/product-images/$p.tar.gz"
          done
      - if: steps.pixelslash.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/product-images/pixelslash.tar.gz
          key: ${{ steps.pixelslash.outputs.cache-primary-key }}
      - if: steps.toggleslash.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/product-images/toggleslash.tar.gz
          key: ${{ steps.toggleslash.outputs.cache-primary-key }}
      - run: bunx moon run self-host:smoke
        env:
          SMOKE_IMAGE: slashslash:smoke
          SMOKE_VERSION: ${{ steps.version.outputs.version }}
          # Every run, so every pin bump and every release is checked against an install the
          # released image made (smoke.ts, upgradeFrom).
          # Still the old owner: nothing is released under slashsuite until its first self-host tag.
          SMOKE_UPGRADE_FROM: ghcr.io/madangryscientist/slashslash:latest
      # Only after the smoke passed (a failed step skips these), and never on a pull request.
      - name: Log in to ghcr
        if: github.event_name == 'push'
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image
        if: github.event_name == 'push'
        shell: bash
        run: |
          for t in ${{ steps.version.outputs.tags }}; do
            docker tag slashslash:smoke "ghcr.io/slashsuite/slashslash:$t"
            docker push "ghcr.io/slashsuite/slashslash:$t"
          done
      # Only on a release tag, after the tested image is pushed.
      - name: Push the Helm chart
        if: github.ref_type == 'tag'
        run: bun self-host/chart.ts publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
