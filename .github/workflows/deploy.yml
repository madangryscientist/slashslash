name: Deploy

# Runs on a push to main, or by hand. Pull requests never reach this workflow, so no pull request run
# can read the Cloudflare token. Only the deploy job below uses it, through the production environment.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # See ci.yml: moon diffs against the base branch first, which needs the full history.
      MOON_BASE: origin/main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx moon run --concurrency 3 :lint :typecheck :build :test
      # Uploaded as the `dist` artifact; the deploy job downloads it to dist/ in its own checkout.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: apps/site/dist
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler pages deploy dist --project-name slashslash --branch main --commit-dirty=true
