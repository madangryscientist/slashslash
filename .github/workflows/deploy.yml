name: Deploy

# Runs on a push to main, or by hand. Pull requests never reach this workflow, so no pull request run
# can read the Cloudflare token. Only the deploy job below uses it, through the production environment.
# The build job writes the shared moon cache through the moon-cache-write environment (main only).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The only job that writes the shared moon cache. The environment admits main alone, so a
    # dispatch from another branch stops here.
    environment: moon-cache-write
    env:
      # See ci.yml: moon diffs against the base branch first, which needs the full history.
      MOON_BASE: origin/main
      MOON_REMOTE_TOKEN: ${{ secrets.MOON_CACHE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # Every page names this commit in its build-commit meta; it is also an input of the build tasks,
      # so a cached dist/ from another commit is never reused.
      - run: bunx moon run --concurrency 3 :lint :typecheck :build :test
        env:
          BUILD_COMMIT: ${{ github.sha }}
      # Uploaded as the `dist` artifact; the deploy job downloads it to dist/ in its own checkout.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: apps/site/dist
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler pages deploy dist --project-name slashslash --branch main --commit-dirty=true

  # After the deploy, what only the live host can show: the home page names the commit this run
  # deployed, and an unknown path answers a real 404 with the site's 404 page. It only reads the live site.
  smoke:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The smoke spec only sends requests, so no browser is installed.
      - run: bun run playwright test --project smoke
        working-directory: apps/site
        env:
          SMOKE_BASE_URL: https://slashslash.build
          SMOKE_EXPECT_COMMIT: ${{ github.sha }}
