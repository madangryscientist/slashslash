$schema: "../../.moon/cache/schemas/project.json"

# The tools live in node_modules/.bin, which moon does not put on PATH, so `bun run` finds them.
# Only fetch-sources and build set their own `inputs`; every other task keeps the default `**/*` of the project.
tasks:
  # The PixelSlash files the /pixelslash pages read, at the commit pinned in pixelslash.sha. The pin
  # is a tracked file, so a new commit there re-runs this and everything after it.
  fetch-sources:
    command: "bun scripts/fetch-sources.ts"
    inputs:
      - "scripts/fetch-sources.ts"
      - "pixelslash.sha"
      # The override, so trying another commit through moon is never a stale cache hit.
      - "$PIXELSLASH_SHA"
    outputs:
      - ".sources"
      - "public/pixelslash"
  build:
    command: "bun run astro build"
    deps:
      - "~:fetch-sources"
    # The default `**/*`, plus the commit the pages name in their build-commit meta (set in the Deploy
    # workflow), so a commit that changes no file the build reads still builds afresh instead of
    # taking a cached dist/ that names the previous commit.
    inputs:
      - "**/*"
      - "$BUILD_COMMIT"
    # .astro/ is generated types that check and build rewrite each run; the tests read dist/ alone.
    outputs:
      - "dist"
  dev:
    command: "bun run astro dev"
    deps:
      - "~:fetch-sources"
    preset: "server"
  typecheck:
    command: "bun run astro check"
    deps:
      - "~:fetch-sources"
  lint:
    command: "bun run oxlint --deny-warnings"
  test:
    # The tests read the built pages in dist/.
    command: "bun run vitest run"
    deps:
      - "~:build"
  e2e:
    # The page loop in a real browser, on the production build: Chromium desktop and a Chromium phone.
    # The smoke project runs only against the deployed host, from deploy.yml.
    command: "bun run playwright test --project desktop --project phone"
    deps:
      - "~:build"
